apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  labels:
    app: taskflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-api
  template:
    metadata:
      labels:
        app: taskflow-api
    spec:
      containers:
        - name: taskflow-api
          # SOLUCIÓN (lab01): imagen publicada en el registry interno.
          # "tu-namespace" es un placeholder: reemplazarlo por el tuyo
          # real (el que devuelve "oc project -q").
          image: "image-registry.openshift-image-registry.svc:5000/tu-namespace/taskflow-api:lab01"
          ports:
            - containerPort: 8080

        # SOLUCIÓN (lab01): sidecar de PostgreSQL para que "localhost" (la
        # connection string hardcodeada de la app) resuelva dentro del Pod.
        # Se reemplaza por un Deployment separado en el lab02.
        - name: postgres
          image: "registry.redhat.io/rhel9/postgresql-16:latest"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: "taskflow"
            - name: POSTGRESQL_USER
              value: "taskflow"
            - name: POSTGRESQL_PASSWORD
              value: "TaskFlow!2024"
