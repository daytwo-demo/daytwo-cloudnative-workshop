apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  labels:
    app: taskflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-api
  template:
    metadata:
      labels:
        app: taskflow-api
    spec:
      containers:
        - name: taskflow-api
          # TODO (lab01): imagen publicada en el registry interno, ej.
          # image-registry.openshift-image-registry.svc:5000/<tu-namespace>/taskflow-api:lab01
          image: "TODO"
          ports:
            - containerPort: 8080

        # TODO (lab01): sidecar de PostgreSQL para que "localhost" (la
        # connection string hardcodeada de la app) resuelva dentro del Pod.
        # Se reemplaza por un Deployment separado en el lab02.
        - name: postgres
          image: "image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: "TODO"
            - name: POSTGRESQL_USER
              value: "TODO"
            - name: POSTGRESQL_PASSWORD
              value: "TODO"
