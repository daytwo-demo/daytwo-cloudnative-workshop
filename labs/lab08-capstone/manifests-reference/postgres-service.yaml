apiVersion: v1
kind: Service
metadata:
  # Este nombre es el que va en Db__Host del ConfigMap: DNS interno de
  # OpenShift lo resuelve dentro del namespace.
  name: taskflow-db
  labels:
    app: taskflow-db
spec:
  selector:
    app: taskflow-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
