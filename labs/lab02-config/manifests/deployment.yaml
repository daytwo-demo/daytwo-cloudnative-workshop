apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  labels:
    app: taskflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-api
  template:
    metadata:
      labels:
        app: taskflow-api
    spec:
      containers:
        - name: taskflow-api
          # TODO (lab02): imagen reconstruida en el paso 2 (tag lab02, no
          # lab01 -- el Program.cs cambió), ya sin sidecar de Postgres.
          image: "TODO"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: Db__Username
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: username
            - name: Db__Password
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: password
